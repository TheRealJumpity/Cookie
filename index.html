<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fullscreen Alert Prank</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Fullscreen overlay */
    #overlay {
      position: fixed;
      inset: 0;
      background: black;
      color: white;
      display: none; /* start hidden */
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 3em;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <h1>Hello</h1>

  <!-- Fullscreen overlay -->
  <div id="overlay">☆ミ ST4R</div>

  <script>
    // 1️⃣ First, show one alert
    alert("☆ミ ST4R");

    // 2️⃣ Then start the fullscreen overlay loop
    const overlay = document.getElementById("overlay");
    overlay.style.display = "flex"; // show fullscreen

    const messages = ["☆ミ ST4R", "LOL", "2EZ", "GET TROLLED"];
    let i = 0;

    // loop every 1 second
    setInterval(() => {
      overlay.textContent = messages[i % messages.length]; // change text
      i++;

      // optional: flash background
      overlay.style.background = i % 2 === 0 ? "black" : "#111";
    }, 1000);
  </script>

</body>
</html>
