<!DOCTYPE html>
<html>
<head>
  <title>Send Message</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f14;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #1c1c25;
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      text-align: center;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
      padding: 10px;
      resize: none;
    }

    button {
      background: #5865F2;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #4752c4;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2>Send Me a Message</h2>
    <textarea id="message" placeholder="Type your message..."></textarea>
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function sendMessage() {
      const message = document.getElementById("message").value;

      if (!message.trim()) {
        alert("Message cannot be empty!");
        return;
      }

      fetch("https://discord.com/api/webhooks/1471675721259946016/PwvGbLVLfz17C1yQDO1ImR4aQYRogJCsDX1F1gmuuixXfL6x7ns6tmbS2z7IrggAFpwR", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          content: "New message from website:\n\n" + message
        })
      })
      .then(() => {
        alert("Message sent!");
        document.getElementById("message").value = "";
      })
      .catch(() => {
        alert("Error sending message.");
      });
    }
  </script>

</body>
</html>
